spring.application.name=smsmvari-backend


spring.datasource.url=jdbc:mysql://localhost:3306/smsmvari_db
spring.datasource.username=smsmvari_user
spring.datasource.password=SmsmVari@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyThatShouldBeAtLeast32CharsLong!}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=2592000000

# ─── Auth ─────────────────────────────────────────────────────────────────────
app.auth.max-failed-attempts=5
app.auth.otp-expiry-minutes=10

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
